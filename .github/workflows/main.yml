name: Build mod jar

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project zip
        run: |
          set -e
          ZIP=$(ls -1 observer-mod*.zip 2>/dev/null | sort | tail -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "No observer-mod*.zip found in the repository root. Upload the project zip."
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf proj tmp_unzip
          mkdir tmp_unzip
          unzip -q "$ZIP" -d tmp_unzip
          if [ -f tmp_unzip/build.gradle ]; then
            mv tmp_unzip proj
          else
            TOP=$(find tmp_unzip -maxdepth 1 -mindepth 1 -type d | head -n 1)
            mv "$TOP" proj
          fi
          echo "Java files: $(find proj/src -name '*.java' | wc -l)"
          test "$(find proj/src -name '*.java' | wc -l)" -ge 60

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build
        working-directory: proj
        run: gradle build --no-daemon

      - name: Verify jar is not empty
        working-directory: proj
        run: |
          ls -l build/libs
          unzip -l build/libs/observer-*.jar | grep "com/observer/ObserverMod.class"
          unzip -l build/libs/observer-*.jar | grep "com/observer/boss/ObserverBossEntity.class"

      - uses: actions/upload-artifact@v4
        with:
          name: observer-jar
          path: proj/build/libs/observer-*.jar

