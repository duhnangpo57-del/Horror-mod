name: Build mod jar

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put flat files into src/ (skipped if src/ exists)
        run: |
          python3 - <<'PY'
          import glob, os, re, shutil
          if os.path.isdir('src/main/java'):
              print('src/ already exists, nothing to do')
              raise SystemExit
          res = {
              'en_us.json': 'src/main/resources/assets/observer/lang',
              'th_th.json': 'src/main/resources/assets/observer/lang',
              'the_observer.png': 'src/main/resources/assets/observer/textures/entity',
              'the_observer_eyes.png': 'src/main/resources/assets/observer/textures/entity',
              'the_observer_spawn_egg.json': 'src/main/resources/assets/observer/models/item',
              'mods.toml': 'src/main/resources/META-INF',
              'pack.mcmeta': 'src/main/resources',
          }
          for f in glob.glob('*.java'):
              m = re.search(r'^package\s+([\w.]+);', open(f, encoding='utf-8').read(), re.M)
              d = 'src/main/java/' + m.group(1).replace('.', '/')
              os.makedirs(d, exist_ok=True)
              shutil.move(f, d)
          for f, d in res.items():
              if os.path.exists(f):
                  os.makedirs(d, exist_ok=True)
                  shutil.move(f, d)
          PY

      - name: Check sources
        run: |
          echo "Java files: $(find src -name '*.java' | wc -l)"
          test "$(find src -name '*.java' | wc -l)" -ge 25

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle build --no-daemon

      - name: Verify jar is not empty
        run: |
          ls -l build/libs
          unzip -l build/libs/observer-*.jar | grep "com/observer/ObserverMod.class"

      - uses: actions/upload-artifact@v4
        with:
          name: observer-jar
          path: build/libs/observer-*.jar
          
